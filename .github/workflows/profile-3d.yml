name: GitHub Profile

# Renders the contribution graph as an isometric SVG into profile-3d-contrib/,
# then corrects the star and fork totals it draws so they include the org.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# The job pushes the regenerated SVGs and README, so the default token needs write.
permissions:
  contents: write

env:
  ORG: Samuels-Development

jobs:
  build:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # The graph draws stars and forks from `ownerAffiliations: OWNER`, which is
      # personally-owned repositories only. That is hardcoded in the action's
      # GraphQL query and no input changes it, so the totals are recomputed here
      # and substituted into the rendered SVGs.
      #
      # Public repositories only: the figure is then verifiable by anyone reading
      # it, and it does not disclose how many private repositories the org holds.
      - name: Total stars and forks across the org
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --jq runs per page, so --paginate yields one TSV line per repository.
          gh api "orgs/${ORG}/repos?per_page=100&type=public" --paginate \
            --jq '.[] | [.stargazers_count, .forks_count] | @tsv' > repos.tsv
          gh api "users/${{ github.repository_owner }}/repos?per_page=100&type=owner" --paginate \
            --jq '.[] | [.stargazers_count, .forks_count] | @tsv' >> repos.tsv

          # Seeded first: an empty repos.tsv makes awk print nothing, and under
          # `set -u` the guard below would then abort on an unbound variable
          # rather than reporting the real problem.
          REPOS=0 STARS=0 FORKS=0
          eval "$(awk -F'\t' '{r++; s+=$1; f+=$2} END {printf "REPOS=%d STARS=%d FORKS=%d", r, s, f}' repos.tsv)"

          # A failed API call would total zero and quietly blank the badges.
          if [ "$REPOS" -eq 0 ]; then
            echo "::error::Counted 0 repositories, refusing to write badges."
            exit 1
          fi
          echo "Counted ${REPOS} public repositories, ${STARS} stars, ${FORKS} forks."
          rm -f repos.tsv

          node .github/scripts/patch-svg.js profile-3d-contrib "$STARS" "$FORKS"

      # A day with no contribution change regenerates identical SVGs, and
      # `git commit` exits non-zero with nothing staged. Guarding it keeps the
      # schedule green instead of failing on every quiet day.
      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A profile-3d-contrib README.md
          if git diff --staged --quiet; then
            echo 'Nothing changed, nothing to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh contribution graph and stats'
          git push
